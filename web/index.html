    <script>
    if ('serviceWorker' in navigator) {
      // A notification click can't navigate an already-open tab from the worker:
      // client.navigate() rejects unless the calling worker controls the client,
      // and a worker on the Firebase Messaging scope never controls a page. The
      // worker posts the payload here instead, and we apply it as a URL
      // parameter so the Dart side picks it up the same way it does a cold open.
      navigator.serviceWorker.addEventListener('message', function (event) {
        var encodedMessage = event.data && event.data.ffPushNotification;
        if (!encodedMessage) {
          return;
        }
        var target = new URL(window.location.href);
        target.searchParams.set('ffPushNotification', encodedMessage);
        window.location.replace(target.href);
      });
      navigator.serviceWorker.startMessages();

      window.addEventListener('load', function () {
        navigator.serviceWorker.register(
          '/firebase-messaging-sw.js',
          { scope: '/firebase-cloud-messaging-push-scope' },
        ).catch(function (error) {
          console.error('Firebase messaging service worker registration failed:', error);
        });
      });
    }
  </script>
