name: lexity
description: >
  Discover one extraordinary, rare, or untranslatable word from around the
  world every single day. Each daily card pairs an unforgettable concept with
  custom retro-futuristic art and synchronized audio that lights up your
  screen as the word is spoken aloud. Standard word of the day apps hand you
  a plain text definition on a white screen and expect you to remember it. We
  built a daily audio-visual ritual designed for writers, creatives, and the
  endlessly curious. Instead of reading dry definitions, you see the mood of
  the concept, hear its natural pronunciation, and explore the history behind
  it.

# The following line prevents the package from being accidentally published to
